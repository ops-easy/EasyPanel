apiVersion: v1
kind: ConfigMap
metadata:
  name: easypanel-config
  namespace: easy
  labels:
    app.kubernetes.io/part-of: easy
    app.kubernetes.io/name: easypanel
    app.kubernetes.io/component: backend
data:
  config.yaml: |-
    # 这里只放启动必需配置；页面可修改的业务配置保存到 MySQL 动态配置。
    server:
      address: 0.0.0.0:8080
      model: release
      publicUrl: "https://easypanel.example.com"
      user: admin
      # DASHBOARD_PASSWORD / DASHBOARD_SESSION_SECRET 由 easypanel-secrets 注入
      sessionDays: 7
      cookieSecure: true
      accessLog: true
      serveFrontend: false

    db:
      host: mysql.easy.svc.cluster.local
      port: 3306
      db: easypanel
      username: easypanel
      # MYSQL_PASSWORD 由 easypanel-secrets 注入

    redis:
      address: redis.easy.svc.cluster.local:6379
      # REDIS_PASSWORD 由 easypanel-secrets 注入
      db: 0

    startup:
      schedulers:
        enabled: true

    performance:
      mode: release
      namespacesCacheTtlSec: 30
