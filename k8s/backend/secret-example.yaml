# 示例：将敏感环境变量放入 Secret，再由 Deployment 引用。
# 部署前请替换占位符，并建议删除本文件中的注释再 apply（或改用 kubectl create secret）。
#
# kubectl apply -f secret-example.yaml
# deployment.yaml 已默认通过 envFrom 引用 easypanel-secrets。
apiVersion: v1
kind: Secret
metadata:
  name: easypanel-secrets
  namespace: easy
  labels:
    app.kubernetes.io/part-of: easy
    app.kubernetes.io/name: easypanel
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  # Web 登录（与 DASHBOARD_USER 对应）
  DASHBOARD_PASSWORD: "REPLACE_WITH_STRONG_DASHBOARD_PASSWORD"
  DASHBOARD_SESSION_SECRET: "REPLACE_WITH_RANDOM_32_BYTES_HEX"
  EASYPANEL_ENCRYPTION_KEY: "REPLACE_WITH_RANDOM_32_BYTES_HEX"
  MYSQL_PASSWORD: "REPLACE_WITH_MYSQL_PASSWORD"
  REDIS_PASSWORD: "REPLACE_WITH_REDIS_PASSWORD"
  # 可选：宝塔 API
  BAOTA_API_KEY: "REPLACE_IF_USED"
