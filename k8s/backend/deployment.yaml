# 部署顺序见仓库根目录 README「Kubernetes 部署顺序」。
# 1) 先创建 namespace / rbac / pvc / secret
# 2) 将下面 image 改为你的 GHCR 镜像仓库
# 3) 敏感环境变量建议用 Secret（参考 secret-example.yaml）通过 envFrom 注入
#
# 多副本与性能（底层说明）：
# - 单 Pod 内仅 1 个 Go 进程；横向扩展请提高 replicas，并用 Service 负载均衡。
# - 每个 Pod 会跑全套后台协程；多副本时务必仅 1 个 Pod 保持 EASYPANEL_ENABLE_BACKGROUND_JOBS=true（默认），
#   其余副本设 EASYPANEL_ENABLE_BACKGROUND_JOBS=false，否则宝塔 Ingress 同步、告警巡检、出站通知、审计裁剪等会重复执行。
# - 登录失败限流等仍有一部分进程内内存状态，多副本下阈值按 Pod 分散；生产建议前置统一 WAF/网关限流。
# - 会话 nonce 在 MySQL platform_kv 时多副本可共享；若仅用文件 KV+共享 PVC，须注意并发写（推荐 MySQL）。
# - EASYPANEL_GOMAXPROCS 建议与 resources.limits.cpu 整核数一致（如 limits.cpu: "2" 则设 EASYPANEL_GOMAXPROCS=2）。
# - EASYPANEL_PERFORMANCE_MODE=true 时 Gin 走 release 模式并启用命名空间列表 Redis 短缓存（需 Redis）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: easypanel-backend
  namespace: easy
  labels:
    app.kubernetes.io/part-of: easy
    app.kubernetes.io/name: easypanel
    app.kubernetes.io/component: backend
spec:
  # 多副本示例：replicas: 3，且仅其中 1 个 Pod 不要设置 EASYPANEL_ENABLE_BACKGROUND_JOBS=false，其余为 false。
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: easypanel
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: easy
        app.kubernetes.io/name: easypanel
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: easypanel
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      initContainers:
        - name: wait-for-platform-deps
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - name: WAIT_MYSQL_HOST
              value: "mysql.easy.svc.cluster.local"
            - name: WAIT_MYSQL_PORT
              value: "3306"
            - name: WAIT_REDIS_ADDR
              value: "redis.easy.svc.cluster.local:6379"
          envFrom:
            - secretRef:
                name: easypanel-secrets
          command:
            - /bin/sh
            - -ec
            - |
              mysql_host="${MYSQL_HOST:-$WAIT_MYSQL_HOST}"
              mysql_port="${MYSQL_PORT:-$WAIT_MYSQL_PORT}"
              redis_addr="${REDIS_ADDR:-$WAIT_REDIS_ADDR}"
              redis_host="${redis_addr%%:*}"
              redis_port="${redis_addr##*:}"
              until nc -z "$mysql_host" "$mysql_port"; do
                echo "waiting for MySQL at ${mysql_host}:${mysql_port}"
                sleep 3
              done
              until nc -z "$redis_host" "$redis_port"; do
                echo "waiting for Redis at ${redis_host}:${redis_port}"
                sleep 3
              done
      containers:
        - name: backend
          image: ghcr.io/ops-easy/easypanel-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: "Asia/Shanghai"
            - name: EASYPANEL_DATA_DIR
              value: "/data"
            - name: EASYPANEL_CONFIG_FILE
              value: "/app/config.yaml"
          envFrom:
            - secretRef:
                name: easypanel-secrets
            # 与 limits.cpu 对齐，避免 P 线程数大于 cgroup 配额
            # - name: EASYPANEL_GOMAXPROCS
            #   value: "2"
            # 多副本时额外 Pod 设为 false
            # - name: EASYPANEL_ENABLE_BACKGROUND_JOBS
            #   value: "false"
            # - name: EASYPANEL_PERFORMANCE_MODE
            #   value: "true"
            # 示例：宝塔与 DDNS（建议用 Secret 引用，勿直接写密钥）
            # - name: BAOTA_URL
            #   value: "http://你的公网IP:宝塔面板端口"
            # - name: BAOTA_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: easypanel-secrets
            #       key: BAOTA_API_KEY
            # - name: DDNS_HOST
            #   value: "home.example.com"
            # - name: DEFAULT_PORT
            #   value: "38333"
            # - name: SYNC_INTERVAL_SEC
            #   value: "30"
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
      imagePullSecrets:
        - name: ghcr-pull-secret
      volumes:
        - name: config
          configMap:
            name: easypanel-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: data
          persistentVolumeClaim:
            claimName: easypanel-data
