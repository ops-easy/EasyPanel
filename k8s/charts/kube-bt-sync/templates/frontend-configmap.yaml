{{- $backend := .Values.backend | default dict -}}
{{- $backendService := $backend.service | default dict -}}
{{- $legacyService := .Values.service | default dict -}}
{{- $frontend := .Values.frontend | default dict -}}
{{- $nginx := $frontend.nginx | default dict -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kube-bt-sync.frontendFullname" . }}-nginx
  labels:
    {{- include "kube-bt-sync.frontendLabels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://{{ include "kube-bt-sync.fullname" . }}:{{ default ($backendService.port | default 8080) $legacyService.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout {{ $nginx.proxyReadTimeout | default "3600s" }};
            proxy_send_timeout {{ $nginx.proxySendTimeout | default "3600s" }};
        }

        location /r/ {
            proxy_pass http://{{ include "kube-bt-sync.fullname" . }}:{{ default ($backendService.port | default 8080) $legacyService.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
