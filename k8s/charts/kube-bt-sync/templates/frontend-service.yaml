{{- $frontend := .Values.frontend | default dict -}}
{{- $service := $frontend.service | default dict -}}
{{- $serviceType := $service.type | default "NodePort" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-bt-sync.frontendFullname" . }}
  labels:
    {{- include "kube-bt-sync.frontendLabels" . | nindent 4 }}
spec:
  type: {{ $serviceType }}
  selector:
    {{- include "kube-bt-sync.frontendSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ $service.port | default 80 }}
      targetPort: http
      {{- if eq $serviceType "NodePort" }}
      nodePort: {{ $service.nodePort | default 32080 }}
      {{- end }}
      protocol: TCP
