{{- $frontend := .Values.frontend | default dict -}}
{{- $image := $frontend.image | default dict -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-bt-sync.frontendFullname" . }}
  labels:
    {{- include "kube-bt-sync.frontendLabels" . | nindent 4 }}
spec:
  replicas: {{ $frontend.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "kube-bt-sync.frontendSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kube-bt-sync.frontendSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: {{ include "kube-bt-sync.name" . }}
    spec:
      {{- with $frontend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ $image.repository }}:{{ $image.tag | default "latest" }}"
          imagePullPolicy: {{ $image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 80
          {{- with $frontend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml ($frontend.resources | default dict) | nindent 12 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "kube-bt-sync.frontendFullname" . }}-nginx
      {{- with $frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $frontend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
