{{- $backend := .Values.backend | default dict -}}
{{- $legacyImage := .Values.image | default dict -}}
{{- $backendImage := $backend.image | default dict -}}
{{- $legacyService := .Values.service | default dict -}}
{{- $backendService := $backend.service | default dict -}}
{{- $env := default ($backend.env | default dict) .Values.env -}}
{{- $extraEnv := default ($backend.extraEnv | default list) .Values.extraEnv -}}
{{- $extraEnvFrom := default ($backend.extraEnvFrom | default list) .Values.extraEnvFrom -}}
{{- $podSecurityContext := default ($backend.podSecurityContext | default dict) .Values.podSecurityContext -}}
{{- $securityContext := default ($backend.securityContext | default dict) .Values.securityContext -}}
{{- $resources := default ($backend.resources | default dict) .Values.resources -}}
{{- $nodeSelector := default ($backend.nodeSelector | default dict) .Values.nodeSelector -}}
{{- $affinity := default ($backend.affinity | default dict) .Values.affinity -}}
{{- $tolerations := default ($backend.tolerations | default list) .Values.tolerations -}}
{{- $config := $backend.config | default dict -}}
{{- $dbConfig := $config.db | default dict -}}
{{- $redisConfig := $config.redis | default dict -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "easypanel.fullname" . }}
  labels:
    {{- include "easypanel.labels" . | nindent 4 }}
spec:
  replicas: {{ default ($backend.replicaCount | default 1) .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "easypanel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "easypanel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: easy
    spec:
      {{- with $podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "easypanel.serviceAccountName" . }}
      initContainers:
        - name: wait-for-platform-deps
          image: {{ default "busybox:1.36" $backend.dependencyWaitImage | quote }}
          imagePullPolicy: IfNotPresent
          env:
            {{- with $extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            - name: WAIT_MYSQL_HOST
              value: {{ default "mysql.easy.svc.cluster.local" $dbConfig.host | quote }}
            - name: WAIT_MYSQL_PORT
              value: {{ default 3306 $dbConfig.port | quote }}
            - name: WAIT_REDIS_ADDR
              value: {{ default "redis.easy.svc.cluster.local:6379" $redisConfig.address | quote }}
          {{- with $extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - -ec
            - |
              mysql_host="${MYSQL_HOST:-$WAIT_MYSQL_HOST}"
              mysql_port="${MYSQL_PORT:-$WAIT_MYSQL_PORT}"
              redis_addr="${REDIS_ADDR:-$WAIT_REDIS_ADDR}"
              redis_host="${redis_addr%%:*}"
              redis_port="${redis_addr##*:}"
              until nc -z "$mysql_host" "$mysql_port"; do
                echo "waiting for MySQL at ${mysql_host}:${mysql_port}"
                sleep 3
              done
              until nc -z "$redis_host" "$redis_port"; do
                echo "waiting for Redis at ${redis_host}:${redis_port}"
                sleep 3
              done
      containers:
        - name: easypanel
          image: "{{ default $backendImage.repository $legacyImage.repository }}:{{ default ($backendImage.tag | default "latest") $legacyImage.tag }}"
          imagePullPolicy: {{ default ($backendImage.pullPolicy | default "Always") $legacyImage.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ default ($backendService.port | default 8080) $legacyService.port }}
          {{- with $securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $env $extraEnv }}
          env:
            {{- range $k, $v := $env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- with $extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with $extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml $resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "easypanel.fullname" . }}-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "easypanel.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
