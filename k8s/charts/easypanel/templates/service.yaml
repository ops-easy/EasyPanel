{{- $backend := .Values.backend | default dict -}}
{{- $backendService := $backend.service | default dict -}}
{{- $legacyService := .Values.service | default dict -}}
{{- $serviceType := default ($backendService.type | default "ClusterIP") $legacyService.type -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "easypanel.fullname" . }}
  labels:
    {{- include "easypanel.labels" . | nindent 4 }}
spec:
  type: {{ $serviceType }}
  selector:
    {{- include "easypanel.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ default ($backendService.port | default 8080) $legacyService.port }}
      targetPort: http
      {{- if eq $serviceType "NodePort" }}
      nodePort: {{ default ($backendService.nodePort | default 32080) $legacyService.nodePort }}
      {{- end }}
      protocol: TCP
