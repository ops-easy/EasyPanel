backend:
  replicaCount: 1

  image:
    repository: ghcr.io/ops-easy/easypanel-api
    pullPolicy: Always
    tag: "latest"

  service:
    type: ClusterIP
    port: 8080
    nodePort: 32080

  podSecurityContext:
    fsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532

  securityContext: {}

  resources:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  env:
    EASYPANEL_DATA_DIR: "/data"
    EASYPANEL_CONFIG_FILE: "/app/config.yaml"

  # 这里只放启动必需配置；页面可修改的业务配置保存到 MySQL 动态配置。
  config:
    server:
      address: "0.0.0.0:8080"
      model: release
      publicUrl: "https://easypanel.example.com"
      user: admin
      # DASHBOARD_PASSWORD / DASHBOARD_SESSION_SECRET 由 easypanel-secrets 注入
      sessionDays: 7
      cookieSecure: true
      accessLog: true
      serveFrontend: false
    db:
      host: mysql.easy.svc.cluster.local
      port: 3306
      db: easypanel
      username: easypanel
      # MYSQL_PASSWORD 由 easypanel-secrets 注入
    redis:
      address: redis.easy.svc.cluster.local:6379
      # REDIS_PASSWORD 由 easypanel-secrets 注入
      db: 0
    startup:
      schedulers:
        enabled: true
    performance:
      mode: release
      namespacesCacheTtlSec: 30

  extraEnv: []

  # 敏感信息默认从预先创建的 Secret 注入，生产不要写进 values.yaml。
  extraEnvFrom:
    - secretRef:
        name: easypanel-secrets

  nodeSelector: {}
  tolerations: []
  affinity: {}

frontend:
  replicaCount: 1

  image:
    repository: ghcr.io/ops-easy/easypanel-web
    pullPolicy: Always
    tag: "latest"

  service:
    type: NodePort
    port: 80
    nodePort: 32080

  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  nginx:
    proxyReadTimeout: 3600s
    proxySendTimeout: 3600s

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: easypanel.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi

rbac:
  # true = 与 k8s/backend/rbac.yaml 一致（控制台 + YAML 下发）；false = 仅 Ingress 同步（需自行改模板）
  full: true
