<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 176" role="img" aria-labelledby="title desc">
  <title id="title">EasyPanel</title>
  <desc id="desc">EasyPanel project logo with a blue sync bridge icon and wordmark.</desc>
  <defs>
    <linearGradient id="mark-bg" x1="26" y1="28" x2="144" y2="146" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A5EC8"/>
      <stop offset="1" stop-color="#0F8FB1"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1A5EC8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <rect x="24" y="20" width="136" height="136" rx="30" fill="url(#mark-bg)"/>
  </g>
  <path
    d="M56 94 C60 56 124 56 128 94"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="12"
    stroke-linecap="round"
  />
  <path
    d="M56 94 H108"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="12"
    stroke-linecap="round"
  />
  <path
    d="M99 81 L114 94 L99 107"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="56" cy="94" r="21" fill="#FFFFFF"/>
  <circle cx="56" cy="94" r="10" fill="#1A5EC8"/>
  <circle cx="128" cy="94" r="21" fill="#FFFFFF"/>
  <circle cx="128" cy="94" r="10" fill="#0891B2"/>

  <text
    x="190"
    y="108"
    fill="#0F172A"
    font-family="Inter, 'Segoe UI', Arial, sans-serif"
    font-size="64"
    font-weight="800"
    letter-spacing="0"
  >
    <tspan>Easy</tspan><tspan fill="#1A5EC8">Panel</tspan>
  </text>
</svg>
