name: Publish container images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  publish:
    name: Publish ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: easypanel-api
            context: .
            file: ./api/Dockerfile
            build_args: |
              BUILD_VERSION=${{ github.sha }}
          - name: frontend
            image: easypanel-web
            context: ./web
            file: ./web/Dockerfile
            build_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        if: matrix.name == 'backend'
        uses: actions/setup-go@v5
        with:
          go-version-file: ./api/go.mod

      - name: Test backend
        if: matrix.name == 'backend'
        run: |
          cp api/config.example.yaml api/config.yaml
          cd api
          go test ./...

      - name: Set up Node.js
        if: matrix.name == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./web/package-lock.json

      - name: Check frontend
        if: matrix.name == 'frontend'
        working-directory: ./web
        run: |
          npm ci
          npm run check
          npm run smoke:dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
