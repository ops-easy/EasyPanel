name: Frontend remote smoke

on:
  workflow_dispatch:
    inputs:
      base-url:
        description: Deployed EasyPanel base URL, for example https://staging.example.com
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Remote readiness smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REMOTE_SMOKE_BASE_URL: ${{ inputs.base-url }}
      SMOKE_AUTH_COOKIE: ${{ secrets.SMOKE_AUTH_COOKIE }}
      SMOKE_BEARER_TOKEN: ${{ secrets.SMOKE_BEARER_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run remote readiness smoke
        working-directory: ./frontend
        run: npm run smoke:deploy:readiness -- --base-url "$REMOTE_SMOKE_BASE_URL"
